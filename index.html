<!doctype html>
<html lang="%SITE_LANG%">
  <head>
    <meta charset="UTF-8" />

    <!-- ============================================================ -->
    <!-- 🔧 SITE CONFIG                                                -->
    <!-- Brand name, domain, tracking IDs come from src/config/site.js -->
    <!-- via the siteConfigHtml Vite plugin — edit values there, not   -->
    <!-- here, so a rebuild can never leave a stale ID behind.         -->
    <!-- ============================================================ -->
    <link rel="icon" type="image/png" href="%SITE_FAVICON%" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003a6c" />
    <meta
      name="description"
      content="Walk-in and out-of-hours medical care in Waterford. Urgent care, minor injuries, women's health and same-day consultations. Book online or just walk in."
    />
    <meta name="keywords" content="medical care Waterford, walk-in clinic Waterford, out of hours medical care Waterford, urgent care Waterford, doctor appointment Waterford" />
    <link rel="canonical" href="%SITE_DOMAIN%/" />
    <title>Waterford Walk In Clinic | Walk-In & Out-of-Hours Medical Care</title>

    <!-- ============================================================ -->
    <!-- 🌐 SOCIAL SHARING: Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <!-- ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_BRAND%" />
    <meta property="og:title" content="Waterford Walk In Clinic | Walk-In & Out-of-Hours Medical Care" />
    <meta property="og:description" content="Walk-in and out-of-hours medical care in Waterford. Urgent care, minor injuries, women's health and same-day consultations." />
    <meta property="og:url" content="%SITE_DOMAIN%/" />
    <!-- TODO: og-image.png does not exist yet — supply a real 1200×630 PNG.
         SVG is deliberately NOT used here: Facebook, LinkedIn, X and
         WhatsApp all silently refuse image/svg+xml, so a share renders
         with no image at all until this is a real PNG/JPG. -->
    <meta property="og:image" content="%SITE_DOMAIN%/og-image.png" />
    <meta property="og:image:alt" content="Waterford Walk In Clinic — walk-in and out-of-hours medical care" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IE" />

    <!-- ============================================================ -->
    <!-- 🐦 SOCIAL SHARING: Twitter / X Card                          -->
    <!-- ============================================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Waterford Walk In Clinic | Walk-In & Out-of-Hours Medical Care" />
    <meta name="twitter:description" content="Walk-in and out-of-hours medical care in Waterford. Urgent care, minor injuries, women's health and same-day consultations." />
    <meta name="twitter:image" content="%SITE_DOMAIN%/og-image.png" />

    <!-- ============================================================ -->
    <!-- 📊 GOOGLE ANALYTICS (GA4) + GOOGLE ADS conversion tag        -->
    <!-- IDs come from src/config/site.js — currently EMPTY for this  -->
    <!-- client. An empty %GA4_ID%/%GOOGLE_ADS_ID% means gtag loads   -->
    <!-- with a blank config and reports nothing, rather than silently -->
    <!-- reporting Waterford's traffic into the previous client's      -->
    <!-- GA4/Ads accounts. Fill in site.js once this client's own      -->
    <!-- properties exist — do not hardcode IDs here.                  -->
    <!-- ============================================================ -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%GA4_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', '%GA4_ID%');
      gtag('config', '%GOOGLE_ADS_ID%');
    </script>

    <!-- ============================================================ -->
    <!-- 🔍 STRUCTURED DATA (JSON-LD): powers Google rich results.    -->
    <!-- Organization + WebSite + MedicalBusiness + FAQPage.          -->
    <!--                                                               -->
    <!-- ⚠️ address, openingHoursSpecification, telephone-as-address- -->
    <!-- proof and aggregateRating are DELIBERATELY OMITTED below.    -->
    <!-- None of these are published on the client's current site or  -->
    <!-- confirmed by the client, and inventing a street address or    -->
    <!-- opening hours for a medical business in structured data is    -->
    <!-- worse than leaving the field out — Google may show it as fact -->
    <!-- to someone deciding where to seek care. Add each field only   -->
    <!-- once the client has confirmed it in src/data/siteData.js.     -->
    <!-- ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "%SITE_DOMAIN%/#organization",
          "name": "%SITE_BRAND%",
          "url": "%SITE_DOMAIN%/",
          "logo": "%SITE_DOMAIN%/logo.png",
          "description": "Walk-in and out-of-hours medical clinic in Waterford, Ireland. Book appointments online."
        },
        {
          "@type": "WebSite",
          "@id": "%SITE_DOMAIN%/#website",
          "url": "%SITE_DOMAIN%/",
          "name": "%SITE_BRAND%",
          "publisher": { "@id": "%SITE_DOMAIN%/#organization" },
          "inLanguage": "en-IE"
        },
        {
          "@type": "MedicalBusiness",
          "@id": "%SITE_DOMAIN%/#waterford",
          "name": "Waterford Walk In Clinic",
          "description": "Walk-in and out-of-hours medical care in Waterford. Urgent care, minor injuries, women's health and same-day consultations.",
          "url": "%SITE_DOMAIN%/",
          "telephone": "+353515552424",
          "email": "info@waterfordclinic.ie",
          "parentOrganization": { "@id": "%SITE_DOMAIN%/#organization" },
          "medicalSpecialty": ["GeneralPractice", "PrimaryCare"]
        },
        {
          "@type": "FAQPage",
          "@id": "%SITE_DOMAIN%/#faq",
          "mainEntity": [
            { "@type": "Question", "name": "Do I need an appointment to be seen?", "acceptedAnswer": { "@type": "Answer", "text": "No. Waterford Walk In Clinic operates a walk-in service, so you can arrive and wait for the next available doctor. Booking online is recommended if you want a guaranteed time, especially at busier periods." } },
            { "@type": "Question", "name": "Can you treat minor injuries instead of the hospital?", "acceptedAnswer": { "@type": "Answer", "text": "For many minor injuries, yes — we handle lacerations and stitches, skin lesion removal and ingrown toenail treatment on site, usually far faster than an emergency department. Serious injuries should still go to an ED." } },
            { "@type": "Question", "name": "Can I get a sick certificate for work?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Medical certificates for work, school or college are issued following a consultation with one of our doctors." } },
            { "@type": "Question", "name": "What if I have a medical emergency?", "acceptedAnswer": { "@type": "Answer", "text": "Waterford Walk In Clinic is not an emergency service. In a life-threatening emergency always call 999 or 112, or go to your nearest Emergency Department." } }
          ]
        }
      ]
    }
    </script>

    <!-- ============================================================ -->
    <!-- Fonts                                                         -->
    <!-- ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Speeds up the hero background photo (largest above-fold element).
         TODO: HERO_BG_URL in src/components/Hero.jsx is still the generic
         stock photo from the platform template — swap for the client's own
         photography when available, and drop this preconnect if it's
         hosted locally instead of on Unsplash. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
